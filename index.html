 {name:'Saif',loc:'Age 40',en:'Everyone knows we wear a uniform in the fire department. We wear special boots, pants, jackets, gloves, and helmets because we need them. It also shows people that we’re firefighters. We’re there to help them. I think our uniform’s great! It makes me feel part of the fire department.',vi:'Ai cũng biết chúng tôi mặc đồng phục trong đội cứu hỏa. Chúng tôi mang ủng và mặc quần, áo khoác, găng tay, mũ bảo hộ chuyên dụng vì công việc cần đến chúng. Đồng phục cũng giúp mọi người nhận ra chúng tôi là lính cứu hỏa. Chúng tôi có mặt để giúp đỡ họ. Tôi thấy đồng phục của mình rất tuyệt! Nó khiến tôi cảm thấy mình là một phần của đội cứu hỏa.'},

};

function taskState(id) {

function task(id, before='') {
  const [title,instructions,questions,style] = tasks[id];

  const questionsHTML = questions.map((item,i) => {
    const idRef = id+'-q'+i;
    const choices = style==='select' || ['read2a','read2b','opinion'].includes(id) ? item.choices : seedOrder(item.choices,i+2);
    const opts = style==='select' 
      ? '<select data-index="'+i+'" aria-labelledby="'+idRef+'"><option value="">Choose a word</option>'+choices.map((choice,j)=>'<option value="'+j+'" '+(state.answers[i].includes(choice)?'selected':'')+'>'+choice+'</option>').join('')+'</select>'
      : '<div class="options" role="group" aria-labelledby="'+idRef+'">'+choices.map((choice,j)=>'<button type="button" class="choice" aria-pressed="'+state.answers[i].includes(choice)+'" data-index="'+i+'" data-option="'+j+'">'+choice+'</button>').join('')+'</div>';
    return '<div class="q"><div class="q-head"><span class="num" aria-hidden="true">'+(i+1)+'</span><p id="'+idRef+'">'+item.prompt+'</p></div>'+opts+'<p class="feedback" hidden></p></div>';

  const list = '<div class="qs">'+questionsHTML+'</div>';

}

    case 4: return card('Before you read','<p>Talk with a partner. What do people usually wear for celebrations where you live? What are you wearing today?</p>')+reading(festivalText,'festival')+task('read2a',photoGrid())+task('read2b');
    case 5: return card('Before you read','<p>Do you wear a uniform at work or at school? Pick the prompt that fits and talk with a partner.</p>'+two(note('Yes, I do','Describe your uniform. Do you like wearing it? Why or why not?'),note('No, I don’t','Do you think uniforms are a good idea? Why or why not?')))+card('Reading skill: Fact or opinion?',two(mini('Fact','<p>A fact is information you can check.</p><p class="sample">The uniform includes a blue sweater.</p>'),mini('Opinion','<p>An opinion is what someone thinks or feels. Look for phrases like <em>I think</em> or adjectives like <em>boring</em>.</p><p class="sample">I think the uniform is boring.</p>','alt')))+reading(uniformText,'uniform')+task('fact')+card('Reading · Exercise 2B','<p>Work in pairs. Say one fact without naming the person. Your partner guesses who said it. Then swap roles.</p>'+note('Show example','<p><strong>A:</strong> I wear a hat, a shirt, and pants to work.<br><strong>B:</strong> That’s Hannah.</p>'))+task('opinion')+card('Text Builder: Adjectives','<p>Put an adjective <strong>before a noun</strong> or <strong>after the verb be</strong>.</p><p class="sample">We wear a <strong>great</strong> uniform. · The uniform is <strong>great</strong>.</p>')+task('adjective');
    case 6: return card('1 · Choose a job','<p class="intro">Imagine that you are creating a new uniform for a team. Tap a role.</p><div class="job-grid" role="group" aria-label="Choose a job">'+jobNames.map((name,i)=>'<button type="button" class="choice job" data-job="'+i+'" aria-pressed="'+(jobIndex===i)+'"><img src="'+assets.jobs[i]+'" alt="">'+name+'</button>').join('')+'</div><div id="speaking-panel" aria-live="polite">'+speakingPanel()+'</div>')+card('2 · Prepare with a partner','<p>Take one minute. Decide on <strong>three clothing items</strong>, their colors, and one reason for your choices. Include one fact about your design and one opinion.</p>'+note('Show useful phrases','<ul><li>Our uniform includes …</li><li>Workers usually wear …</li><li>Today, our model is wearing …</li><li>I think the uniform looks … because …</li><li>Why did you choose …?</li></ul>')+note('Show a model answer','<p>Our restaurant uniform includes a white shirt, black pants, and a green apron. Our servers usually wear black shoes, too. Today, our model is wearing a green apron with two pockets. I think this uniform is practical because the pockets can hold a pen and a small notebook.</p>'))+card('3 · Speak for 60 seconds','<ol><li><strong>Speaker A:</strong> Present your design.</li><li><strong>Speaker B:</strong> Ask a follow-up question and give an opinion.</li><li><strong>Switch roles:</strong> Choose a different job and repeat.</li></ol><div class="controls"><output class="timer" id="timer" aria-label="Time remaining">1:00</output>'+button('Start timer','start','primary')+button('Reset timer','timer-reset')+'</div>'+note('Show a quick speaking checklist','<ul><li>Did you name at least three items of clothing?</li><li>Did you give a fact, an opinion, and a reason?</li><li>Did both partners speak?</li></ul>'));
    default: return '';
  }
}
function renderPage() {
  clearInterval(timerID);
  seconds = 60;
  currentPage = Math.max(0,pages.findIndex(([id])=>location.hash==='#'+id));
  renderNav();
  const [, ,unit,title,description] = pages[currentPage];
  const prev = pages[currentPage-1];
  const next = pages[currentPage+1];
  main.innerHTML = '<section class="hero '+(currentPage===6?'speak':currentPage>=4?'reading':'')+'" data-mark="'+unit+'"><p class="kicker">UNIT '+unit+' · '+(currentPage<5?'PARTY TIME':currentPage===5?'READING SKILLS':'PAIR WORK')+'</p><h1 tabindex="-1">'+title+'</h1><p>'+description+'</p></section>'+content()+'<div class="sequence">'+(prev?'<a class="btn" href="#'+prev[0]+'">← Previous section</a>':'<span></span>')+(next?'<a class="btn primary" href="#'+next[0]+'">Next section →</a>':'<a class="btn primary" href="#vocabulary">Back to vocabulary ↗</a>')+'</div>';
  main.querySelectorAll('.task').forEach(syncTask);
}
function sameAnswer(picked, expected) {
  return picked.length===expected.length && expected.every(value=>picked.includes(value));
}
function syncTask(section) {
  const id = section.dataset.task;
  const state = taskState(id);
  const questions = tasks[id][2];
  let correct = 0;
  let answered = 0;
  section.querySelectorAll('.q').forEach((node,i)=>{
    const picked = state.answers[i];
    const item = questions[i];
    const match = sameAnswer(picked,item.answer);
    const show = state.checked && picked.length>0;
    answered += Number(picked.length>0);
    correct += Number(match);
    node.classList.toggle('good',show && match);
    node.classList.toggle('bad',show && !match);
    const feedback = node.querySelector('.feedback');
    feedback.hidden = !state.key && !show;
    feedback.textContent = state.key?'Answer: '+item.answer.join(' · '):show?(match?'Correct.':'Try again.'):''; 
  });
  section.querySelector('.result').textContent = state.checked
    ? correct+' of '+questions.length+' correct.'+(answered<questions.length?' '+(questions.length-answered)+' unanswered.':'')
    : '';
  section.querySelector('[data-action="key"]').textContent = state.key?'Hide answer key':'Show answer key';
}
function selectChoice(buttonNode) {
  const section = buttonNode.closest('.task');
  const i = Number(buttonNode.dataset.index);
  const option = buttonNode.textContent;
  const state = taskState(section.dataset.task);
  const item = tasks[section.dataset.task][2][i];
  const current = state.answers[i];
  state.answers[i] = current.includes(option) ? current.filter(value=>value!==option) : item.multiple ? [...current,option] : [option];
  buttonNode.closest('.q').querySelectorAll('.choice').forEach(choice=>choice.setAttribute('aria-pressed',state.answers[i].includes(choice.textContent)));
  state.checked = false;
  syncTask(section);
}
main.addEventListener('change',e=>{
  if(!e.target.matches('select[data-index]')) return;
  const section = e.target.closest('.task');
  const i = Number(e.target.dataset.index);
  const state = taskState(section.dataset.task);
  state.answers[i] = e.target.value===''?[]:[tasks[section.dataset.task][2][i].choices[Number(e.target.value)]];
  state.checked = false;
  syncTask(section);
});
main.addEventListener('click',e=>{
  const clicked = e.target.closest('button');
  if(!clicked) return;
  if(clicked.hasAttribute('data-option')) return selectChoice(clicked);
  if(clicked.hasAttribute('data-job')) {
    jobIndex = Number(clicked.dataset.job);
    main.querySelectorAll('[data-job]').forEach(job=>job.setAttribute('aria-pressed',job===clicked));
    document.getElementById('speaking-panel').innerHTML = speakingPanel();
    return;
  }
  const action = clicked.dataset.action;
  const section = clicked.closest('.task');
  if(section) {
    const id = section.dataset.task;
    const state = taskState(id);
    if(action==='check') state.checked = true;
    if(action==='key') state.key = !state.key;
    if(action==='reset') {
      delete saved[id];
      section.querySelectorAll('.choice').forEach(choice=>choice.setAttribute('aria-pressed','false'));
      section.querySelectorAll('select').forEach(select=>select.value='');
    }
    syncTask(section);
  }
  if(['reveal','next-card','previous-card'].includes(action)) {
    if(action==='reveal') revealed = !revealed;
    else {
      cardIndex += action==='next-card'?1:-1;
      revealed = false;
    }
    const region = document.getElementById('flash');
    region.innerHTML = flash();
    const same = region.querySelector('[data-action="'+action+'"]');
    (same.disabled?region.querySelector('[data-action="reveal"]'):same).focus();
  }
  if(action==='translate') {
    const visible = clicked.getAttribute('aria-expanded')==='false';
    const passage = document.getElementById(clicked.getAttribute('aria-controls'));
    passage.querySelectorAll('.translation').forEach(p=>p.hidden=!visible);
    clicked.setAttribute('aria-expanded',String(visible));
    clicked.textContent = visible?'Hide Vietnamese translation':'Show Vietnamese translation';
  }
  if(action==='start' || action==='timer-reset') {
    clearInterval(timerID);
    const output = document.getElementById('timer');
    const start = main.querySelector('[data-action="start"]');
    if(action==='timer-reset' || seconds===0) seconds = 60;
    const display = () => output.textContent = Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');
    display();
    start.disabled = action==='start';
    start.textContent = action==='start'?'Timer running':'Start timer';
    if(action==='start') {
      const end = Date.now()+seconds*1000;
      timerID = setInterval(()=>{
        seconds = Math.max(0,Math.ceil((end-Date.now())/1000));
        display();
        if(seconds===0) {
          clearInterval(timerID);
          start.disabled = false;
          start.textContent = 'Start again';
          output.textContent = 'Time’s up!';
        }
      },200);
    }
  }
});
window.addEventListener('hashchange',()=>{
  renderPage();
  window.scrollTo(0,0);
  main.querySelector('h1').focus({preventScroll:true});
});
renderPage();
</script>
</body></html>
